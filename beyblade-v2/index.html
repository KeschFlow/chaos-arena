<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070b18">
  <link rel="icon" href="data:,">
  <title>CHAOS ARENA V2 — Kreiselkampf</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      display: flex;
      justify-content: center;
      overflow: hidden;
      background: #070b18;
      color: #f6f8ff;
      font: 600 15px system-ui, sans-serif;
    }
    main {
      display: flex;
      width: min(100%, 480px);
      height: 100vh;
      height: 100dvh;
      min-height: 360px;
      flex-direction: column;
      gap: 8px;
      padding: max(10px, env(safe-area-inset-top)) 12px max(10px, env(safe-area-inset-bottom));
    }
    header { display: flex; justify-content: space-between; align-items: center; }
    h1 { margin: 0; font-size: clamp(13px, 3.8vw, 18px); white-space: nowrap; }
    #round { font-size: 13px; white-space: nowrap; }
    small { color: #9fb0d5; }
    #stage {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      border: 1px solid #273959;
      border-radius: 18px;
      background: radial-gradient(ellipse at center, #1d3053, #090e1d 70%);
    }
    canvas { display: block; width: 100%; height: 100%; }
    #status {
      position: absolute;
      top: 10px;
      right: 10px;
      left: 10px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      text-shadow: 0 2px 4px #000;
    }
    #banner {
      position: absolute;
      right: 8px;
      bottom: 18px;
      left: 8px;
      text-align: center;
      font-size: clamp(15px, 4vw, 19px);
      font-weight: 900;
      text-shadow: 0 2px 8px #000;
    }
    #matchup {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      grid-template-rows: auto auto;
      align-items: center;
      gap: 3px 6px;
      padding: 9px;
      border-radius: 9px;
      background: #18233a;
      text-align: center;
      font-size: 12px;
    }
    #matchup .team { min-width: 0; white-space: nowrap; }
    #matchup .team.right { text-align: right; }
    #matchup .team small { display: block; font-size: 10px; }
    #matchup strong { margin: 0 4px; color: #fff; font-size: 17px; }
    #matchup .round-info { grid-column: 1 / -1; }
    footer { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    button {
      min-width: 0;
      min-height: 48px;
      padding: 10px 6px;
      border: 0;
      border-radius: 12px;
      background: #6d50fa;
      color: #fff;
      font: inherit;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
    }
    button.secondary { background: #27334c; }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
    @media (max-height: 560px) {
      main { min-height: 0; gap: 5px; padding-top: 6px; padding-bottom: 6px; }
      h1 { font-size: 15px; }
      #matchup { padding: 5px; }
      button { min-height: 42px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>UNAUFHALTSAM · CHAOS ARENA V2</h1>
        <small>WELTLIGA · SAISON 1</small>
      </div>
      <strong id="round">KAMPF 1</strong>
    </header>
    <section id="stage" aria-label="Kreiselkampf">
      <canvas id="arena" aria-label="3D-Ansicht des Arena-Kampfes"></canvas>
      <div id="status"><span id="timer">00:00</span><span id="count">2 IM RING</span></div>
      <div id="banner" aria-live="polite">EINZEL · 1 GEGEN 1</div>
    </section>
    <div id="matchup">
      <span class="team">001 KREISELKREIS <small id="leftPlayer">SPIELER 1</small></span>
      <strong>0 : 0</strong>
      <span class="team right">TEAM 002 <small id="rightPlayer">SPIELER 1</small></span>
      <small class="round-info">KAMPF <span id="matchCount">1</span> · EINZEL</small>
    </div>
    <footer>
      <button id="restart">NEUER KAMPF</button>
      <button id="pause" class="secondary">PAUSE</button>
      <button id="sound" class="secondary" aria-pressed="false" title="Spielton einschalten">TON AUS</button>
    </footer>
    <small>LIVE-HOCHFORMAT · Ton über die Schaltfläche aktivieren</small>
  </main>
  <script type="module">
    import {createBattle, step, STEP, TYPES} from './physics.js';

    const canvas = document.querySelector('#arena');
    const ctx = canvas.getContext('2d');
    const banner = document.querySelector('#banner');
    const pauseButton = document.querySelector('#pause');
    const soundButton = document.querySelector('#sound');
    const timer = document.querySelector('#timer');
    const count = document.querySelector('#count');
    const roundLabel = document.querySelector('#round');
    const leftPlayer = document.querySelector('#leftPlayer');
    const rightPlayer = document.querySelector('#rightPlayer');
    const matchCount = document.querySelector('#matchCount');
    let battle = createBattle(1, [0, 1], [1, 1]);
    let running = true;
    let previous = 0;
    let accumulator = 0;
    let round = 1;
    let doneAt = 0;
    let eventCursor = 0;
    let audioContext = null;
    let masterGain = null;
    let effectsGain = null;
    let musicGain = null;
    let tensionGain = null;
    let musicSources = [];
    let musicStarted = false;
    let lastMusicUpdate = 0;
    let soundEnabled = false;
    let lastHitSoundAt = 0;

    function restart() {
      round++;
      const player = (round - 1) % 4 + 1;
      battle = createBattle(round, [round % 4, (round + 1) % 4], [player, player]);
      running = true;
      doneAt = 0;
      accumulator = 0;
      eventCursor = 0;
      banner.textContent = 'EINZEL · 1 GEGEN 1';
      roundLabel.textContent = 'KAMPF ' + round;
      leftPlayer.textContent = 'SPIELER ' + player;
      rightPlayer.textContent = 'SPIELER ' + player;
      matchCount.textContent = round;
      pauseButton.textContent = 'PAUSE';
    }

    document.querySelector('#restart').onclick = restart;
    pauseButton.onclick = () => {
      running = !running;
      pauseButton.textContent = running ? 'PAUSE' : 'WEITER';
    };

    function playTone(startFrequency, endFrequency, duration, delay = 0) {
      if (!soundEnabled || audioContext?.state !== 'running') return;
      const start = audioContext.currentTime + delay;
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      oscillator.type = 'sine';
      oscillator.frequency.setValueAtTime(startFrequency, start);
      oscillator.frequency.exponentialRampToValueAtTime(Math.max(1, endFrequency), start + duration);
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.07, start + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
      oscillator.connect(gain);
      gain.connect(effectsGain);
      oscillator.addEventListener('ended', () => {
        oscillator.disconnect();
        gain.disconnect();
      }, {once: true});
      oscillator.start(start);
      oscillator.stop(start + duration + 0.01);
    }

    function createMusicBuffer(tension = false) {
      const bpm = 112;
      const beat = 60 / bpm;
      const duration = beat * 16;
      const sampleRate = audioContext.sampleRate;
      const buffer = audioContext.createBuffer(1, Math.ceil(sampleRate * duration), sampleRate);
      const samples = buffer.getChannelData(0);
      const roots = [55, 49, 65.41, 58.27];
      const chords = [
        [110, 130.81, 164.81, 196],
        [98, 116.54, 146.83, 174.61],
        [130.81, 155.56, 196, 233.08],
        [116.54, 138.59, 174.61, 207.65]
      ];
      const arpeggio = [0, 1, 2, 3, 2, 1, 2, 3];
      let noise = 0x6d2b79f5;
      for (let i = 0; i < samples.length; i++) {
        const time = i / sampleRate;
        const beatPosition = time / beat;
        const beatIndex = Math.floor(beatPosition);
        const beatPhase = beatPosition - beatIndex;
        const bar = Math.floor(beatIndex / 4) % 4;
        let value = 0;
        if (tension) {
          const stepLength = beat / 2;
          const step = Math.floor(time / stepLength);
          const noteAge = time - step * stepLength;
          const chord = chords[Math.floor(step / 8) % 4];
          const note = chord[arpeggio[step % 8]];
          value = Math.sin(2 * Math.PI * note * noteAge) * Math.exp(-noteAge * 5) * 0.13;
          const hatAge = time % stepLength;
          noise ^= noise << 13;
          noise ^= noise >>> 17;
          noise ^= noise << 5;
          value += ((noise >>> 0) / 2147483648 - 1) * Math.exp(-hatAge * 100) * 0.025;
        } else {
          const kickFrequency = 48 + 78 * Math.exp(-beatPhase * 22);
          value += Math.sin(2 * Math.PI * kickFrequency * beatPhase) * Math.exp(-beatPhase * 12) * 0.38;
          const bassFrequency = roots[bar] / 2;
          value += Math.sin(2 * Math.PI * bassFrequency * beatPhase) * Math.exp(-beatPhase * 2.4) * 0.18;
          const barPhase = (beatIndex % 4 + beatPhase) / 4;
          const pad = Math.min(1, barPhase / 0.16, (1 - barPhase) / 0.12) * 0.10;
          for (const frequency of chords[bar]) {
            value += Math.sin(2 * Math.PI * frequency * time) * pad * 0.25;
          }
          const halfBeatAge = time % (beat / 2);
          noise ^= noise << 13;
          noise ^= noise >>> 17;
          noise ^= noise << 5;
          value += ((noise >>> 0) / 2147483648 - 1) * Math.exp(-halfBeatAge * 100) * 0.035;
        }
        samples[i] = Math.tanh(value * 1.5) * 0.22;
      }
      return buffer;
    }

    function startMusic() {
      if (musicStarted) return;
      masterGain = audioContext.createGain();
      masterGain.gain.value = 0;
      masterGain.connect(audioContext.destination);
      effectsGain = audioContext.createGain();
      effectsGain.gain.value = 0.65;
      effectsGain.connect(masterGain);
      musicGain = audioContext.createGain();
      musicGain.gain.value = 0.55;
      musicGain.connect(masterGain);
      tensionGain = audioContext.createGain();
      tensionGain.gain.value = 0.015;
      tensionGain.connect(masterGain);
      for (const [buffer, output] of [
        [createMusicBuffer(), musicGain],
        [createMusicBuffer(true), tensionGain]
      ]) {
        const source = audioContext.createBufferSource();
        source.buffer = buffer;
        source.loop = true;
        source.connect(output);
        source.start();
        musicSources.push(source);
      }
      musicStarted = true;
    }

    function updateMusicTension(now) {
      if (!soundEnabled || !musicStarted || now - lastMusicUpdate < 750) return;
      lastMusicUpdate = now;
      const recentHits = battle.events.filter(event => event.type === 'hit' && battle.tick - event.tick < 3600).length;
      const shrinking = Math.max(0, Math.min(1, (1 - battle.radius) / 0.75));
      const intensity = Math.max(shrinking, Math.min(1, recentHits / 16));
      tensionGain.gain.setTargetAtTime(0.015 + intensity * 0.16, audioContext.currentTime, 0.8);
    }

    function playEventSound(event) {
      if (event.type === 'hit') {
        const now = performance.now();
        if (now - lastHitSoundAt > 100) {
          playTone(340, 220, 0.07);
          lastHitSoundAt = now;
        }
      } else if (event.type === 'ringout') {
        playTone(440, 130, 0.28);
      } else if (event.type === 'winner') {
        playTone(480, 720, 0.16);
        playTone(640, 960, 0.2, 0.16);
        playTone(820, 1180, 0.3, 0.34);
      }
    }

    async function toggleSound() {
      if (soundEnabled) {
        soundEnabled = false;
        masterGain.gain.setTargetAtTime(0, audioContext.currentTime, 0.025);
        soundButton.textContent = 'TON AUS';
        soundButton.title = 'Spielton einschalten';
        soundButton.setAttribute('aria-pressed', 'false');
        try {
          await audioContext.suspend();
        } catch (error) {
          console.error('Audio konnte nicht pausiert werden.', error);
        }
        return;
      }
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) {
        soundButton.textContent = 'TON NICHT DA';
        soundButton.title = 'Dieser Browser unterstützt keine Web-Audio-Ausgabe.';
        return;
      }
      audioContext ??= new AudioContextClass();
      try {
        await audioContext.resume();
      } catch (error) {
        soundButton.textContent = 'TON FEHLER';
        soundButton.title = String(error);
        console.error('Audio konnte nicht aktiviert werden.', error);
        return;
      }
      if (audioContext.state !== 'running') {
        soundButton.textContent = 'TON GESPERRT';
        soundButton.title = 'Der Browser hat die Audio-Ausgabe nicht freigegeben.';
        return;
      }
      startMusic();
      masterGain.gain.setTargetAtTime(0.65, audioContext.currentTime, 0.06);
      soundEnabled = true;
      soundButton.textContent = 'TON AN';
      soundButton.title = 'Spielton ausschalten';
      soundButton.setAttribute('aria-pressed', 'true');
    }

    soundButton.onclick = () => { void toggleSound(); };

    function topDraw(p, cx, cy, scale, labelLane) {
      const x = cx + p.x * scale;
      const y = cy + p.y * scale * 0.85;
      const r = p.radius * scale;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(p.angle);
      ctx.shadowColor = '#000';
      ctx.shadowBlur = 12;
      ctx.shadowOffsetY = 7;
      ctx.fillStyle = '#050713';
      ctx.beginPath();
      ctx.ellipse(0, r * 0.34, r * 1.04, r * 0.78, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.shadowOffsetY = 0;
      ctx.fillStyle = TYPES[p.type].color;
      ctx.beginPath();
      ctx.ellipse(0, 0, r, r * (0.64 - p.tilt * 0.2), 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#e7f4ff';
      ctx.lineWidth = Math.max(1, r * 0.12);
      ctx.beginPath();
      ctx.ellipse(0, 0, r * 0.75, r * 0.48, 0, 0, Math.PI * 2);
      ctx.stroke();
      for (let i = 0; i < 5; i++) {
        const angle = i * Math.PI * 2 / 5;
        ctx.beginPath();
        ctx.moveTo(Math.cos(angle) * r * 0.3, Math.sin(angle) * r * 0.2);
        ctx.lineTo(Math.cos(angle) * r * 0.88, Math.sin(angle) * r * 0.56);
        ctx.strokeStyle = '#11192c';
        ctx.lineWidth = r * 0.16;
        ctx.stroke();
      }
      ctx.fillStyle = '#e8eaff';
      ctx.beginPath();
      ctx.ellipse(0, 0, r * 0.27, r * 0.18, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      ctx.fillStyle = '#fff';
      ctx.font = `bold ${Math.max(9, Math.min(12, r * 0.58))}px system-ui`;
      ctx.textAlign = 'center';
      ctx.fillText(p.name, x, y - r - 10 - labelLane * 16);
    }

    function draw() {
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      if (canvas.width !== Math.round(width * dpr) || canvas.height !== Math.round(height * dpr)) {
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, width, height);
      const active = battle.tops.filter(p => p.alive);
      const extentX = Math.max(battle.radius, ...active.map(p => Math.abs(p.x) + p.radius + 0.35));
      const extentY = Math.max(battle.radius, ...active.map(p => Math.abs(p.y) + p.radius + 0.28 + active.length * 0.07));
      const scale = Math.max(1, Math.min(
        (width / 2 - 24) / extentX,
        (height / 2 - 32) / (extentY * 0.85)
      ));
      const cx = width / 2;
      const cy = height / 2;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(1, 0.85);
      const radius = battle.radius * scale;
      const glow = ctx.createRadialGradient(0, 0, radius * 0.1, 0, 0, radius);
      glow.addColorStop(0, '#21395c');
      glow.addColorStop(0.85, '#111d35');
      glow.addColorStop(1, '#050915');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#7da7ff';
      ctx.lineWidth = 8;
      ctx.shadowColor = '#5576ff';
      ctx.shadowBlur = 15;
      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.shadowBlur = 0;
      for (let ring = 0.25; ring < 1; ring += 0.25) {
        ctx.strokeStyle = '#33486a';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(0, 0, radius * ring, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.restore();
      active.forEach((top, index) => topDraw(top, cx, cy, scale, index));
      const seconds = Math.floor(battle.tick * STEP);
      timer.textContent = String(Math.floor(seconds / 60)).padStart(2, '0') + ':' + String(seconds % 60).padStart(2, '0');
      count.textContent = active.length + ' IM RING';
    }

    function showBattleEvents(now) {
      const events = battle.events.slice(eventCursor);
      eventCursor = battle.events.length;
      for (const event of events) {
        playEventSound(event);
        if (event.type === 'ringout') {
          banner.textContent = battle.tops[event.id].name + ' · RING-OUT!';
        }
      }
      if (battle.winner !== null && !doneAt) {
        banner.textContent = 'SIEGER: ' + battle.tops[battle.winner].name;
        doneAt = now;
      } else if (battle.draw && !doneAt) {
        banner.textContent = 'KEIN SIEGER · NEUER KAMPF';
        doneAt = now;
      }
    }

    function frame(now) {
      const elapsed = previous ? Math.min((now - previous) / 1000, 0.08) : 0;
      previous = now;
      if (running && battle.winner === null && !battle.draw) {
        accumulator += elapsed;
        let steps = 0;
        while (accumulator >= STEP && steps++ < 12) {
          step(battle);
          accumulator -= STEP;
        }
        if (steps >= 12) accumulator = 0;
      }
      showBattleEvents(now);
      updateMusicTension(now);
      draw();
      if (doneAt && now - doneAt > 5000) restart();
      requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);
  </script>
</body>
</html>
