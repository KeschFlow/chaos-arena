<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CHAOS ARENA V2 — Kreiselkampf</title><style>
*{box-sizing:border-box}body{margin:0;background:#070b18;color:#f6f8ff;font:600 15px system-ui;display:flex;justify-content:center}main{width:min(100%,480px);height:100dvh;display:flex;flex-direction:column;padding:12px;gap:8px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:18px;margin:0}small{color:#9fb0d5}#stage{flex:1;min-height:0;position:relative;background:radial-gradient(ellipse at center,#1d3053,#090e1d 70%);border:1px solid #273959;border-radius:18px;overflow:hidden}canvas{width:100%;height:100%;display:block}#status{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none;text-shadow:0 2px 4px black}#banner{position:absolute;bottom:18px;left:8px;right:8px;text-align:center;font-size:19px;font-weight:900;text-shadow:0 2px 8px #000}footer{display:flex;gap:8px}button{flex:1;background:#6d50fa;border:0;color:white;border-radius:12px;padding:13px;font-weight:800;cursor:pointer}button.secondary{background:#27334c}#legend{display:flex;flex-wrap:wrap;gap:8px;font-size:12px;justify-content:center}#legend span{padding:5px 8px;border-radius:9px;background:#18233a}
</style></head><body><main><header><div><h1>UNAUFHALTSAM · CHAOS ARENA V2</h1><small>Kreisel-Prototyp · Physik statt Länder</small></div><strong id="round">KAMPF 1</strong></header><section id="stage"><canvas id="arena"></canvas><div id="status"><span id="timer">00:00</span><span id="count">4 IM RING</span></div><div id="banner">VIER KREISEL. EIN SIEGER.</div></section><div id="legend"></div><footer><button id="restart">NEUER KAMPF</button><button class="secondary" id="pause">PAUSE</button></footer><small>V2-Prototyp: vereinfachte 2D-Starrkörperphysik mit 3D-artiger Darstellung. Keine echte 3D-Gyroskop-Simulation.</small></main><script type="module">
import {createBattle,step,STEP,TYPES} from './physics.js';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),banner=document.querySelector('#banner');
let battle=createBattle(1),running=true,previous=0,accumulator=0,round=1,doneAt=0;
document.querySelector('#legend').innerHTML=TYPES.map(t=>'<span style="border-bottom:3px solid '+t.color+'">'+t.name+'</span>').join('');
function restart(){battle=createBattle(++round);running=true;doneAt=0;accumulator=0;banner.textContent='KAMPF STARTET';document.querySelector('#round').textContent='KAMPF '+round;document.querySelector('#pause').textContent='PAUSE'}
document.querySelector('#restart').onclick=restart;document.querySelector('#pause').onclick=()=>{running=!running;document.querySelector('#pause').textContent=running?'PAUSE':'WEITER'};
function topDraw(p,cx,cy,scale){
 const x=cx+p.x*scale,y=cy+p.y*scale,r=p.radius*scale;
 ctx.save();ctx.translate(x,y);ctx.rotate(p.angle);
 ctx.shadowColor='#000';ctx.shadowBlur=12;ctx.shadowOffsetY=7;
 ctx.fillStyle='#050713';ctx.beginPath();ctx.ellipse(0,r*.34,r*1.04,r*.78,0,0,Math.PI*2);ctx.fill();
 ctx.shadowBlur=0;ctx.shadowOffsetY=0;
 ctx.fillStyle=TYPES[p.type].color;ctx.beginPath();ctx.ellipse(0,0,r,r*(.64-p.tilt*.2),0,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle='#e7f4ff';ctx.lineWidth=Math.max(1,r*.12);ctx.beginPath();ctx.ellipse(0,0,r*.75,r*.48,0,0,Math.PI*2);ctx.stroke();
 for(let i=0;i<5;i++){let a=i*Math.PI*2/5;ctx.beginPath();ctx.moveTo(Math.cos(a)*r*.3,Math.sin(a)*r*.2);ctx.lineTo(Math.cos(a)*r*.88,Math.sin(a)*r*.56);ctx.strokeStyle='#11192c';ctx.lineWidth=r*.16;ctx.stroke()}
 ctx.fillStyle='#e8eaff';ctx.beginPath();ctx.ellipse(0,0,r*.27,r*.18,0,0,Math.PI*2);ctx.fill();
 ctx.restore();
 ctx.fillStyle='#fff';ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.fillText(p.name,x,y-r-9);
}
function draw(){
 const w=canvas.clientWidth,h=canvas.clientHeight,dpr=Math.min(devicePixelRatio||1,2);
 if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr)}
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
 const cx=w/2,cy=h/2,scale=Math.min(w*.46,h*.40);
 ctx.save();ctx.translate(cx,cy);ctx.scale(1,.85);
 const rad=battle.radius*scale;
 const glow=ctx.createRadialGradient(0,0,rad*.1,0,0,rad);
 glow.addColorStop(0,'#21395c');glow.addColorStop(.85,'#111d35');glow.addColorStop(1,'#050915');
 ctx.fillStyle=glow;ctx.beginPath();ctx.arc(0,0,rad,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle='#7da7ff';ctx.lineWidth=8;ctx.shadowColor='#5576ff';ctx.shadowBlur=15;ctx.beginPath();ctx.arc(0,0,rad,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0;
 for(let r=.25;r<1;r+=.25){ctx.strokeStyle='#33486a';ctx.lineWidth=1;ctx.beginPath();ctx.arc(0,0,rad*r,0,Math.PI*2);ctx.stroke()}
 ctx.restore();
 for(const p of battle.tops.filter(p=>p.alive))topDraw(p,cx,cy,scale);
 const seconds=Math.floor(battle.tick*STEP);document.querySelector('#timer').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');
 document.querySelector('#count').textContent=battle.tops.filter(p=>p.alive).length+' IM RING';
}
function frame(now){
 const elapsed=previous?Math.min((now-previous)/1000,.08):0;previous=now;
 if(running&&battle.winner===null){
 accumulator+=elapsed;let steps=0;
 while(accumulator>=STEP&&steps++<12){step(battle);accumulator-=STEP}
 if(steps>=12)accumulator=0;
 const last=battle.events[battle.events.length-1];
 if(last?.type==='ringout'&&last.tick===battle.tick)banner.textContent=battle.tops[last.id].name+' · RING-OUT!';
 if(battle.winner!==null){banner.textContent='SIEGER: '+battle.tops[battle.winner].name;doneAt=now}
 }
 draw();if(doneAt&&now-doneAt>5000)restart();requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
