<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CHAOS ARENA 2D</title><style>*{box-sizing:border-box}body{margin:0;background:#080914;color:#fff;font:600 15px system-ui;display:flex;justify-content:center}main{width:min(100vw,480px);min-height:100dvh;padding:12px;display:flex;flex-direction:column;gap:9px}header{text-align:center;font-size:24px;font-weight:900;letter-spacing:2px;color:#e7c8ff}.sub{text-align:center;color:#b9b3c9;font-size:12px}.score{display:flex;justify-content:space-between;align-items:center;background:#1b1930;border:1px solid #554276;border-radius:12px;padding:12px}.team{width:39%;font-size:14px}.team:last-child{text-align:right}.num{font-size:30px;color:#ffd477}.mid{text-align:center;font-size:12px}#stage{position:relative;width:100%;aspect-ratio:1;background:radial-gradient(circle,#39374e 0%,#24263b 60%,#0d0e1b 71%);border-radius:50%;border:7px solid #8061a7;box-shadow:0 0 0 3px #252039,inset 0 0 45px #000;overflow:hidden}canvas{display:block;width:100%;height:100%}#banner{min-height:50px;text-align:center;font-size:20px;font-weight:900;color:#ffe19a}.info{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:#ddd}.buttons{display:flex;gap:8px}button{flex:1;border:1px solid #9472c5;background:#29213e;color:white;border-radius:10px;padding:12px;font-weight:800}footer{text-align:center;font-size:11px;color:#938fa4;margin-top:auto}</style><main><header>CHAOS ARENA <span style="color:#ffcd75">2D</span></header><div class="sub">LIVE · DAVIS-CUP · RING-OUT ONLY</div><div class="score"><div class="team">KREISELKREIS<div class="num" id="a">0</div></div><div class="mid"><div id="match">PARTIE 1 / 5</div><div id="clock">00:00</div></div><div class="team">TEAM VIOLETT<div class="num" id="b">0</div></div></div><div class="info"><span id="players">Spieler 1 vs Spieler 1</span><span id="state">LIVE</span></div><div id="stage"><canvas id="arena"></canvas></div><div id="banner">KAMPF LÄUFT</div><div class="buttons"><button id="sound">TON AUS</button><button id="restart">SPIELTAG NEU</button></div><footer>5 Partien · 4 Einzel + 1 Doppel · nur Ring-Out entscheidet</footer></main><script>
const canvas=document.querySelector('#arena'),ctx=canvas.getContext('2d');let w=600;canvas.width=600;canvas.height=600;
const bouts=[[[1],[1]],[[2],[2]],[[3,4],[3,4]],[[1],[2]],[[2],[1]]];let bout=0,score=[0,0],tops=[],radius=240,elapsed=0,acc=0,last=0,delay=0,finished=false,sound=false,audio=null,started=false,frameId=null;const $=s=>document.querySelector(s);
function beep(f=220,d=.08){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.06,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch{}}
function setup(){radius=240;elapsed=0;delay=0;finished=false;tops=[];const [aa,bb]=bouts[bout];for(const [team,players] of [[0,aa],[1,bb]])for(let j=0;j<players.length;j++){let n=tops.length,ang=2*Math.PI*n/(aa.length+bb.length)+.28;tops.push({team,player:players[j],x:Math.cos(ang)*82,y:Math.sin(ang)*82,vx:-Math.cos(ang)*145-Math.sin(ang)*30,vy:-Math.sin(ang)*145+Math.cos(ang)*30,r:16,alive:true,spin:0})}$('#match').textContent='PARTIE '+(bout+1)+' / 5';$('#players').textContent='Spieler '+aa.join('+')+' vs Spieler '+bb.join('+');$('#banner').textContent='KAMPF LÄUFT';$('#state').textContent='LIVE';}
function reset(){bout=0;score=[0,0];$('#a').textContent='0';$('#b').textContent='0';setup()}
function step(dt){
 if(finished){delay-=dt;if(delay<=0){if(finished==='draw'){setup();return}if(bout===4){$('#banner').textContent='SPIELTAG ENDE · '+score[0]+':'+score[1];$('#state').textContent='ENDE';delay=Infinity}else{bout++;setup()}}return}
 elapsed+=dt;
 radius=Math.max(22,240-Math.max(0,elapsed-32)*2.2);
 const alive=tops.filter(p=>p.alive);
 for(const p of alive){
  p.spin+=dt*17;
  let rival=null,best=Infinity;
  for(const q of alive){if(q.team===p.team)continue;const d=Math.hypot(q.x-p.x,q.y-p.y);if(d<best){best=d;rival=q}}
  if(rival&&best>1){
   const nx=(rival.x-p.x)/best,ny=(rival.y-p.y)/best;
   const force=best>34?230:75;
   p.vx+=nx*force*dt;p.vy+=ny*force*dt;
  }
  const damp=Math.exp(-.015*dt);
  p.vx*=damp;p.vy*=damp;
  let speed=Math.hypot(p.vx,p.vy);
  if(speed<115&&speed>0.01){p.vx*=115/speed;p.vy*=115/speed}
  if(speed>245){p.vx*=245/speed;p.vy*=245/speed}
  p.x+=p.vx*dt;p.y+=p.vy*dt;
  const d=Math.hypot(p.x,p.y);
  if(d+p.r>radius){
   const nx=p.x/(d||1),ny=p.y/(d||1),outward=p.vx*nx+p.vy*ny;
   // A strong outward impact or the contracting boundary causes a real ring-out.
   if(d+p.r>radius+5||outward>185||radius<35){p.alive=false;beep(110,.2)}
   else{
    if(outward>0){p.vx-=1.55*outward*nx;p.vy-=1.55*outward*ny}
    p.x=nx*(radius-p.r);p.y=ny*(radius-p.r);
   }
  }
 }
 for(let i=0;i<tops.length;i++)for(let j=i+1;j<tops.length;j++){
  const p=tops[i],q=tops[j];if(!p.alive||!q.alive)continue;
  const dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy);
  if(d>=p.r+q.r)continue;
  const nx=d>0.001?dx/d:1,ny=d>0.001?dy/d:0;
  const overlap=p.r+q.r-d;
  p.x-=nx*overlap*.5;p.y-=ny*overlap*.5;
  q.x+=nx*overlap*.5;q.y+=ny*overlap*.5;
  const rel=(q.vx-p.vx)*nx+(q.vy-p.vy)*ny;
  if(rel<0){
   const impulse=-rel*.93;
   p.vx-=impulse*nx;p.vy-=impulse*ny;
   q.vx+=impulse*nx;q.vy+=impulse*ny;
  }
  if(p.team!==q.team){
   // Visible recoil even if both tops meet at nearly identical velocity.
   const kick=85;
   p.vx-=kick*nx;p.vy-=kick*ny;
   q.vx+=kick*nx;q.vy+=kick*ny;
   beep(190+Math.random()*100,.04);
  }
 }
 const count=[0,0];for(const p of tops)if(p.alive)count[p.team]++;
 if(count[0]===0||count[1]===0){
  finished=true;delay=3;
  if(count[0]===0&&count[1]===0){
   $('#banner').textContent='GLEICHZEITIGER RING-OUT · WIEDERHOLUNG';
   delay=2;
   // Repeat the same bout without awarding a point.
   finished='draw';
  }else{
   const winner=count[0]>0?0:1;
   score[winner]++;$('#a').textContent=score[0];$('#b').textContent=score[1];
   $('#banner').textContent=(winner===0?'KREISELKREIS':'TEAM VIOLETT')+' GEWINNT DURCH RING-OUT';
   beep(530,.24)
  }
 }
}
function draw(){ctx.clearRect(0,0,600,600);ctx.save();ctx.translate(300,300);ctx.beginPath();ctx.arc(0,0,radius,0,Math.PI*2);ctx.fillStyle='#272b43';ctx.fill();ctx.lineWidth=7;ctx.strokeStyle='#a48abf';ctx.stroke();for(let r=50;r<radius;r+=45){ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.strokeStyle='#ffffff0b';ctx.lineWidth=2;ctx.stroke()}for(const p of tops){if(!p.alive)continue;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.spin);ctx.shadowColor=p.team===0?'#ffb83d':'#b98bff';ctx.shadowBlur=15;ctx.fillStyle=p.team===0?'#f6ac3e':'#9e72eb';ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,p.r,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#161426';ctx.fillRect(-10,-3,20,6);ctx.restore();ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 11px system-ui';ctx.fillText(''+p.player,p.x,p.y-24)}ctx.restore();$('#clock').textContent=String(Math.floor(elapsed/60)).padStart(2,'0')+':'+String(Math.floor(elapsed%60)).padStart(2,'0')}
function frame(now){if(!started)return;if(!last)last=now;let dt=Math.min(.1,(now-last)/1000);last=now;acc+=dt;let steps=0;while(acc>=1/120&&steps<12){step(1/120);acc-=1/120;steps++}draw();frameId=requestAnimationFrame(frame)}
$('#sound').onclick=()=>{sound=!sound;$('#sound').textContent=sound?'TON AN':'TON AUS';if(sound)beep(350,.1)};$('#restart').onclick=reset;reset();draw();started=true;frameId=requestAnimationFrame(frame);
</script></html>
