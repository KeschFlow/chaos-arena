name: Beyblade V2 physics tests
on:
  push:
    branches: [feature/beyblade-physics-v2]
  pull_request:
    paths: ['beyblade-v2/**', '.github/workflows/beyblade-v2.yml']
jobs:
  physics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run physics tests
        run: node --test beyblade-v2/physics.test.mjs
